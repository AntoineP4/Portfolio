<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Pleasant Chalk</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #unity-container { position: relative; background: #000; width: 100%; height: 100%; }
      #unity-canvas { display: block; width: 100%; height: 100%; outline: none; background: #000; }

      #custom-loader {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 15px;
        z-index: 99;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .loader-percent {
        color: #fff;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      }

      .progress-track {
        width: 220px;
        height: 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 2px;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 255, 255, 0.2);
        transition: width 0.15s ease-out;
      }

      #unity-warning { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 100; pointer-events: none; text-align: center; width: 100%; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="custom-loader">
        <div class="loader-percent" id="loader-text">0%</div>
        <div class="progress-track">
          <div class="progress-bar" id="custom-progress-bar"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBox = document.querySelector("#custom-loader");
      var progressBar = document.querySelector("#custom-progress-bar");
      var percentText = document.querySelector("#loader-text");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() { warningBanner.style.display = warningBanner.children.length ? 'block' : 'none'; }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px; color: white; border-radius: 4px; display:inline-block;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px; color: black; border-radius: 4px; display:inline-block;';
          setTimeout(function() { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
        }
        updateBannerVisibility();
      }

      function fitSquare() {
        var w = document.documentElement.clientWidth;
        var h = document.documentElement.clientHeight;
        var s = Math.floor(Math.min(w, h));
        if (s < 1) return;
        container.style.width = s + "px";
        container.style.height = s + "px";
      }

      fitSquare();
      window.addEventListener("resize", fitSquare);

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/pleasant chalk.loader.js";
      var config = {
        dataUrl: buildUrl + "/pleasant chalk.data",
        frameworkUrl: buildUrl + "/pleasant chalk.framework.js",
        codeUrl: buildUrl + "/pleasant chalk.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ISART Digital",
        productName: "Pleasant Chalk",
        productVersion: "1.0.0",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var percent = Math.round(progress * 100);
          progressBar.style.width = (100 * progress) + "%";
          percentText.textContent = percent + "%";
        }).then((unityInstance) => {
          percentText.textContent = "100%";
          progressBar.style.width = "100%";
          loadingBox.style.opacity = "0";
          setTimeout(() => { 
             loadingBox.style.setProperty("display", "none", "important");
             fitSquare();
          }, 600);
        }).catch((message) => { alert(message); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
